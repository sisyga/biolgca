name: CI

on:
  push:
    branches:
      - master
      - aidevelop
      - kio/development
  pull_request:
    branches:
      - master
      - aidevelop
      - kio/development

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  installed-package:
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Exercise installed package and CLI outside source tree
        run: |
          mkdir -p /tmp/biolgca-release-smoke
          cd /tmp/biolgca-release-smoke
          python -c "from lgca import get_lgca; lgca = get_lgca(dims=3, seed=1); print(lgca.__class__.__name__)"
          biolgca examples export random_walk model.json
          biolgca validate model.json
          biolgca run model.json --output run
          test -f run/model.resolved.json
          test -f run/metadata.json
          python -c "import json; data=json.load(open('run/model.resolved.json')); assert data['schema_version'] == 1"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build docs
        run: python -m sphinx -W -b html docs/source docs/_build/html
