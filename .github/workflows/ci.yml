name: CI

on:
  push:
    branches:
      - master
      - aidevelop
      - kio/development
  pull_request:
    branches:
      - master
      - aidevelop
      - kio/development

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked project and development dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync python -m pytest -q

  installed-package:
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build and install wheel in a clean environment
        run: |
          uv build
          uv venv /tmp/biolgca-release-smoke/.venv
          uv pip install --python /tmp/biolgca-release-smoke/.venv dist/*.whl
      - name: Exercise installed package and CLI outside source tree
        run: |
          source /tmp/biolgca-release-smoke/.venv/bin/activate
          cd /tmp/biolgca-release-smoke
          python -c "from lgca import get_lgca; lgca = get_lgca(dims=3, seed=1); print(lgca.__class__.__name__)"
          biolgca examples export random_walk model.json
          biolgca validate model.json
          biolgca run model.json --output run
          test -f run/model.resolved.json
          test -f run/metadata.json
          python -c "import json; data=json.load(open('run/model.resolved.json')); assert data['schema_version'] == 1"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked documentation dependencies
        run: uv sync --locked --no-default-groups --group docs
      - name: Build docs
        run: uv run --no-sync python docs/build.py
