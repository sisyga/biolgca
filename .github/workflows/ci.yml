name: CI

on:
  push:
    branches:
      - master
      - aidevelop
      - kio/development
  pull_request:
    branches:
      - aidevelop
      - kio/development

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  installed-package:
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Import from outside source tree
        run: |
          mkdir -p /tmp/biolgca-import-smoke
          cd /tmp/biolgca-import-smoke
          python -c "from lgca import get_lgca; lgca = get_lgca(dims=3, seed=1); print(lgca.__class__.__name__)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build docs
        run: python -m sphinx -b html docs/source docs/_build/html
