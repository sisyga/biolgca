name: CI

on:
  push:
    branches:
      - master
      - aidevelop
      - kio/development
  pull_request:
    branches:
      - master
      - aidevelop
      - kio/development

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked project and development dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync python -m pytest -q

  platforms:
    name: Tests (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked project and development dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync python -m pytest -q
      - name: Command line, including a sweep in worker processes
        shell: bash
        run: |
          uv run --no-sync biolgca examples export random_walk "$RUNNER_TEMP/model.json"
          uv run --no-sync biolgca validate "$RUNNER_TEMP/model.json"
          uv run --no-sync biolgca run "$RUNNER_TEMP/model.json" --output "$RUNNER_TEMP/run"
          uv run --no-sync biolgca sweep "$RUNNER_TEMP/model.json" --vary steps=5,10 --seeds 0:2 \
            --n-jobs 2 --output "$RUNNER_TEMP/sweep"
          test -f "$RUNNER_TEMP/run/model.resolved.json"
          test -f "$RUNNER_TEMP/sweep/table.csv"

  lowest-versions:
    name: Tests (Python 3.11, minimum dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install the declared minimum versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[yaml]" --group test
          uv pip install nbclient ipykernel
      - name: Run tests
        run: uv run --no-sync python -m pytest -q
      - name: Execute tutorial notebooks
        working-directory: docs/source/tutorials
        run: |
          for notebook in *.ipynb; do
            uv run --no-sync python -c "import sys, nbformat; from nbclient import NotebookClient; NotebookClient(nbformat.read(sys.argv[1], as_version=4), timeout=300).execute()" "$notebook"
          done

  installed-package:
    name: Installed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build and install wheel in a clean environment
        run: |
          uv build
          uv venv /tmp/biolgca-release-smoke/.venv
          uv pip install --python /tmp/biolgca-release-smoke/.venv dist/*.whl
      - name: Exercise installed package and CLI outside source tree
        run: |
          source /tmp/biolgca-release-smoke/.venv/bin/activate
          cd /tmp/biolgca-release-smoke
          python -c "from lgca import get_lgca; lgca = get_lgca(dims=3, seed=1); print(lgca.__class__.__name__)"
          biolgca examples export random_walk model.json
          biolgca validate model.json
          biolgca run model.json --output run
          test -f run/model.resolved.json
          test -f run/metadata.json
          python -c "import json; data=json.load(open('run/model.resolved.json')); assert data['schema_version'] == 1"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked documentation dependencies
        run: uv sync --locked --no-default-groups --group docs
      - name: Build docs
        run: uv run --no-sync python docs/build.py
