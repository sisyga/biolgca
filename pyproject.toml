[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolgca"
version = "0.1.0"
description = "Biological lattice-gas cellular automata simulation tools"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Simon Syga", email = "simon.syga@tu-dresden.de" },
    { name = "Bianca Guettner", email = "bianca.guettner@nct-dresden.de" },
]
keywords = ["cellular automata", "lattice gas", "biological modelling", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9.2",
    "tqdm>=4.64.1",
    "matplotlib>=3.7",
    # Tables of runs from lgca.study.sweep.
    "pandas>=2.1",
    "jupyterlab>=4.0",
    # Progress bars and interactive widgets in notebooks.
    "ipywidgets>=8.0",
]

# Optional user-facing features: `uv sync --extra yaml` or `pip install -e ".[yaml]"`.
[project.optional-dependencies]
yaml = [
    "PyYAML>=6",
]
plot3d = [
    "mayavi>=4.9",
    # Mayavi needs a Qt binding for on-screen windows and animations.
    "PySide6>=6.4",
]

# Contributor tooling (PEP 735). `uv sync` installs the `dev` group by default.
[dependency-groups]
test = [
    "pytest>=8",
    "jsonschema>=4",
    "PyYAML>=6",
]
docs = [
    "Sphinx",
    "sphinx-autodoc-typehints",
    "alabaster",
    "numpydoc",
    "myst-nb",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ruff",
]

[project.urls]
Homepage = "https://github.com/sisyga/biolgca"
Issues = "https://github.com/sisyga/biolgca/issues"
Documentation = "https://biolgca.readthedocs.io/"

[project.scripts]
biolgca = "lgca.cli:main"

[tool.setuptools]
packages = ["lgca", "lgca.examples", "lgca.schemas"]

[tool.setuptools.package-data]
"lgca.schemas" = ["*.json"]
